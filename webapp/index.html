
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#10131b">
<title>Расписание РКТМ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:#10131b; --card:#191e2a; --card2:#222938;
  --text:#f4f6fb; --muted:#9ca8bb; --accent:#83aaff;
  --border:#30384a;
}
* {box-sizing:border-box}
body {
  margin:0; padding:0 16px 35px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text);
}
header {padding:25px 0 22px}
.brand {font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:800}
h1 {font-size:32px;letter-spacing:-1px;margin:5px 0}
.subtitle {font-size:14px;color:var(--muted)}
.panel {background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px}
label {display:block;font-size:12px;color:var(--muted);margin:0 0 8px}
select,input {
  width:100%;padding:14px;margin-bottom:14px;
  color:var(--text);background:var(--card2);
  border:1px solid var(--border);border-radius:12px;
  font-size:15px;outline:none;
}
button {
  border:0;border-radius:12px;padding:14px;
  font-weight:750;font-size:14px;cursor:pointer;
}
.primary {background:var(--accent);color:#101725;width:100%}
.status {font-size:13px;color:var(--muted);margin:15px 2px}
.card {
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:15px;margin-bottom:10px;
  overflow-wrap:anywhere;
}
.card-title {font-size:15px;font-weight:750;margin-bottom:8px;line-height:1.4}
.card-info {font-size:13px;color:var(--muted);line-height:1.7;white-space:pre-wrap}
table {border-collapse:collapse;width:100%;font-size:13px}
th,td {padding:11px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;white-space:pre-wrap}
th {color:var(--accent)}
.table-wrap {overflow-x:auto;background:var(--card);border-radius:16px;border:1px solid var(--border)}
.empty {text-align:center;color:var(--muted);padding:28px 12px;line-height:1.6}
.footer {text-align:center;font-size:11px;color:#707b8f;margin-top:24px}
</style>
</head>
<body>
<header>
  <div class="brand">РКТМ · КОЛЛЕДЖ</div>
  <h1>Расписание</h1>
  <div class="subtitle">Занятия — быстро и удобно</div>
</header>

<section class="panel">
  <label for="source">Выберите расписание</label>
  <select id="source">
    <option value="raspisan">Основное расписание</option>
    <option value="Praspisan">Расписание преподавателей</option>
    <option value="Araspisan">Расписание аудиторий</option>
  </select>

  <label for="search">Поиск по расписанию</label>
  <input id="search" type="search" placeholder="Группа, предмет, преподаватель…">

  <button class="primary" id="reload">Обновить расписание ↻</button>
</section>

<div id="status" class="status">Загрузка расписания…</div>
<main id="results"></main>
<div class="footer">Официальные данные сайта РКТМ</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const API = window.location.origin;
const source = document.getElementById('source');
const search = document.getElementById('search');
const results = document.getElementById('results');
const status = document.getElementById('status');

let rows = [];

function setStatus(text) {
  status.textContent = text;
}

function parseHTML(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');

  const tables = [...doc.querySelectorAll('table')];
  if (tables.length) {
    return tables.flatMap(table =>
      [...table.querySelectorAll('tr')].map(tr =>
        [...tr.querySelectorAll('th,td')].map(td =>
          (td.innerText || td.textContent || '')
            .replace(/\s+/g, ' ').trim()
        ).filter(Boolean)
      ).filter(row => row.length)
    );
  }

  doc.querySelectorAll('script,style,noscript').forEach(el => el.remove());
  return (doc.body.innerText || doc.body.textContent || '')
    .split('\n').map(line => line.trim()).filter(Boolean)
    .map(line => [line]);
}

function render() {
  const query = search.value.trim().toLowerCase();
  const filtered = rows.filter(row =>
    row.join(' ').toLowerCase().includes(query)
  );

  results.innerHTML = '';

  if (!filtered.length) {
    results.innerHTML =
      '<div class="empty">Расписание не найдено.<br>Попробуйте изменить поисковый запрос.</div>';
    return;
  }

  const isTable = filtered.some(row => row.length > 2);

  if (isTable) {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const table = document.createElement('table');

    filtered.slice(0, 500).forEach((row, index) => {
      const tr = document.createElement('tr');

      row.forEach(value => {
        const cell = document.createElement(index === 0 ? 'th' : 'td');
        cell.textContent = value;
        tr.appendChild(cell);
      });

      table.appendChild(tr);
    });

    wrap.appendChild(table);
    results.appendChild(wrap);
  } else {
    filtered.slice(0, 500).forEach((row, index) => {
      const card = document.createElement('article');
      card.className = 'card';

      const title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = row[0] || `Занятие ${index + 1}`;
      card.appendChild(title);

      if (row.length > 1) {
        const info = document.createElement('div');
        info.className = 'card-info';
        info.textContent = row.slice(1).join('\n');
        card.appendChild(info);
      }

      results.appendChild(card);
    });
  }

  setStatus(`Найдено записей: ${filtered.length}`);
}

async function loadSchedule() {
  results.innerHTML = '';
  setStatus('Загружаем расписание…');

  try {
    const response = await fetch(
      `${API}/api/schedule/${encodeURIComponent(source.value)}`,
      {cache:'no-store'}
    );

    if (!response.ok) {
      throw new Error(`Ошибка сервера: ${response.status}`);
    }

    const data = await response.json();
    let html;

    if (typeof data === 'string') html = data;
    else if (typeof data.html === 'string') html = data.html;
    else if (typeof data.content === 'string') html = data.content;
    else if (typeof data.data === 'string') html = data.data;
    else if (Array.isArray(data.rows)) {
      rows = data.rows.map(row => Array.isArray(row) ? row : [String(row)]);
      render();
      return;
    } else {
      throw new Error('Неизвестный формат ответа API');
    }

    rows = parseHTML(html);
    render();

  } catch (error) {
    console.error(error);
    setStatus('Не удалось загрузить расписание.');
    results.innerHTML =
      '<div class="empty">Ошибка загрузки данных.<br>Проверьте сервер Render и адрес источника в app.py.</div>';
  }
}

document.getElementById('reload').addEventListener('click', loadSchedule);
source.addEventListener('change', loadSchedule);
search.addEventListener('input', render);

loadSchedule();
</script>
</body>
</html>
